    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f5efe6;
            color: #3e2f2f;
            padding-top: 88px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 2px 24px;
            background: rgba(62, 47, 47, 0.98);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            color: #fff;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
        }

        nav a {
            color: #e6d5c3;
            text-decoration: none;
            white-space: nowrap;
            font-weight: 500;
        }

        nav a:hover {
            color: #d2a679;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto 20px;
        }

        .filter-bar input,
        .filter-bar select,
        .filter-bar button {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d7c2b4;
            background: #fffaf5;
            color: #3e2f2f;
            font-size: 16px;
        }

        .filter-bar input {
            flex: 1 1 300px;
            min-width: 220px;
        }

        .filter-bar select {
            flex: 0 0 180px;
        }

        .filter-bar button {
            flex: 0 0 auto;
        }

        .filter-bar button {
            cursor: pointer;
            border: none;
            background: #6f4e37;
            color: white;
        }

        .filter-bar button:hover {
            background: #5a3e2b;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 0 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .no-results {
            padding: 40px 20px;
            margin: 20px auto 40px;
            max-width: 1200px;
            text-align: center;
            color: #6f5349;
            font-size: 18px;
        }

        .movie-card {
            background: #fffaf5;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .movie-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .movie-card-link:hover .movie-card {
            transform: translateY(-6px);
        }

        .movie-card img {
            width: 100%;
            display: block;
            height: 280px;
            object-fit: cover;
        }

        .movie-card .info {
            padding: 16px;
        }

        .movie-card h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .movie-card p {
            margin: 0 0 8px;
            font-size: 14px;
            color: #5a4036;
        }

        .movie-card .tag {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 999px;
            background: #d9b49b;
            color: #3e2f2f;
            font-size: 12px;
        }

        .no-results {
            padding: 40px 20px;
            text-align: center;
            color: #6f5349;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="no-results" id="noResults" style="display:none;">
        找不到符合條件的電影。請調整搜尋關鍵字或類型。
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const genreSelect = document.getElementById('genreSelect');
        const resetButton = document.getElementById('resetButton');
        const movieGrid = document.getElementById('movieGrid');
        const noResults = document.getElementById('noResults');
        const cards = Array.from(document.querySelectorAll('.movie-card-link'));

        function filterMovies() {
            const keyword = searchInput.value.trim().toLowerCase();
            const genre = genreSelect.value;
            let visibleCount = 0;

            cards.forEach(card => {
                const article = card.querySelector('.movie-card');
                const title = article.dataset.title.toLowerCase();
                const genres = article.dataset.genre ? article.dataset.genre.toLowerCase() : '';
                const matchesKeyword = keyword === '' || title.includes(keyword) || genres.includes(keyword);
                const matchesGenre = genre === 'all' || genres.includes(genre);

                if (matchesKeyword && matchesGenre) {
                    card.style.display = '';
                    visibleCount += 1;
                } else {
                    card.style.display = 'none';
                }
            });

            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        searchInput.addEventListener('input', filterMovies);
        genreSelect.addEventListener('change', filterMovies);
        resetButton.addEventListener('click', () => {
            searchInput.value = '';
            genreSelect.value = 'all';
            filterMovies();
        });

        filterMovies();
    </script>
