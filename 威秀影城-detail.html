            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .meta-item {
            background: #fffaf5;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid #6f4e37;
        }

        .meta-item strong {
            display: block;
            font-size: 12px;
            color: #6f4e37;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .meta-item span {
            font-size: 16px;
            color: #3e2f2f;
        }

        .movie-description {
            background: #fffaf5;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .movie-description h2 {
            margin: 0 0 20px;
            color: #2c1f1f;
            font-size: 1.5em;
        }

        .trailer-button {
            display: inline-block;
            padding: 15px 30px;
            background: #6f4e37;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .trailer-button:hover {
            background: #5a3e2b;
        }

        .trailer-button.disabled {
            background: #d7cfc6;
            color: #7a6a60;
            cursor: default;
            pointer-events: none;
        }

        .booking-button {
            background: #2b7a78;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .booking-button:hover {
            background: #225f5d;
        }

        .screening-info {
            background: #fffaf5;
            padding: 24px;
            border-radius: 16px;
            border-left: 4px solid #6f4e37;
        }

        .screening-info h3 {
            margin: 0 0 16px;
            color: #2c1f1f;
            font-size: 34px;
        }

        .no-screening {
            color: #a67c52;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .movie-detail {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .movie-info h1 {
                font-size: 2em;
            }
        }

        function getMovieIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        function displayMovieDetail(movieId) {
            const movie = movieData[movieId];
            const movieDetail = document.getElementById('movieDetail');

            if (!movie) {
                movieDetail.innerHTML = `
                    <div class="not-found">
                        <h1>找不到電影資訊</h1>
                        <p>抱歉，我們找不到這部電影的詳細資訊。</p>
                        <a href="威秀影城.html" class="back-button">返回電影列表</a>
                    </div>
                `;
                return;
            }

            movieDetail.innerHTML = `
                <img src="${movie.poster}" alt="${movie.title} 海報" class="movie-poster">
                <div class="movie-info">
                    <h1>${movie.title}</h1>
                    <div class="movie-meta">
                        <div class="meta-item">
                            <strong>分級</strong>
                            <span>${movie.rating}</span>
                        </div>
                        <div class="meta-item">
                            <strong>導演</strong>
                            <span>${movie.director}</span>
                        </div>
                        <div class="meta-item">
                            <strong>演員</strong>
                            <span>${movie.cast}</span>
                        </div>
                        <div class="meta-item">
                            <strong>片長</strong>
                            <span>${movie.duration}</span>
                        </div>
                        <div class="meta-item">
                            <strong>上映日期</strong>
                            <span>${movie.releaseDate}</span>
                        </div>
                        <!-- <div class="meta-item">
                            <strong>類型</strong>
                            <span>${movie.genre}</span>
                        </div> -->
                    </div>
                    <div class="movie-description">
                        <h2>劇情簡介</h2>
                        <p>${movie.description}</p>
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
                        <a href="${movie.trailer}" target="_blank" class="trailer-button">觀看預告片</a>
                        <button id="bookButton" class="trailer-button booking-button">訂票</button>
                    </div>
                </div>
            `;
        }

        const movieId = getMovieIdFromUrl();
        const cinemaSelect = document.getElementById('cinemaSelect');
        const screeningInfo = document.getElementById('screeningInfo');
        const cinemaSection = document.getElementById('cinemaSection');

        displayMovieDetail(movieId);

        // 檢查影城當天是否還有放映
        function hasScreeningToday(cinema) {
            const currentTime = new Date();
            const currentMinutes = currentTime.getHours() * 60 + currentTime.getMinutes();

            if (!theaters) return false;

            for (const times of Object.values(theaters)) {
                for (const time of times) {
                    if (time > currentMinutes) { // 只要有場次在當前時間之後
                        return true;
                    }
                }
            }
            return false;
        }

        // 顯示訂票按鈕
        function displayScreeningInfo(cinema) {
            if (!cinema) {
                screeningInfo.innerHTML = '<p class="no-screening">請選擇影城進行訂票</p>';
                return;
            }

            const url = cinemaUrls[cinema];
            const movieId = getMovieIdFromUrl();

            // 特殊處理環球影城 - 如果是特定電影，跳轉到電影頁面
            if (cinema === "威秀影城" && (movieId === "名偵探柯南" || movieId === "狸想世界(中)" || movieId === "狸想世界(英)" || movieId === "極限返航" || movieId === "超級瑪利歐銀河電影版(中)" || movieId === "超級瑪利歐銀河電影版(英)")) {
                const moviePageUrl = "https://www.u-movie.com.tw/cinema/page.php?ver=tw&page_type=movie&selProgram=1020&id=2147487891&portal=cinema#plot";
                screeningInfo.innerHTML = `
                    <h3>${cinema} 訂票</h3>
                    <p>點擊下方按鈕前往 ${cinema} 官方網站訂票</p>
                    <a href="${moviePageUrl}" target="_blank" class="trailer-button" style="display: inline-block; margin-top: 16px;">前往訂票</a>
                `;
            } else {
                screeningInfo.innerHTML = `
                    <h3>${cinema} 訂票</h3>
                    <p>點擊下方按鈕前往 ${cinema} 官方網站訂票</p>
                    <a href="${url}" target="_blank" class="trailer-button" style="display: inline-block; margin-top: 16px;">前往訂票</a>
                `;
            }
        }

        // 監聽影城選擇變化
        cinemaSelect.addEventListener('change', (e) => {
            displayScreeningInfo(e.target.value);
        });

        // 頁面加載後初始化影城選項
        function showCinemaSection() {
            cinemaSection.style.display = 'block';
            initializeCinemaOptions();
            displayScreeningInfo('');
        }

        showCinemaSection();

        // 處理訂票按鈕行為：若已選影城則開啟該影城訂票頁，否則展開選影城區塊並聚焦選單
        function attachBookButtonHandler() {
            const bookBtn = document.getElementById('bookButton');
            if (!bookBtn) return;
            bookBtn.addEventListener('click', () => {
                const selected = cinemaSelect.value;
                const movieId = getMovieIdFromUrl();
                if (selected) {
                    if (selected === "威秀影城" && (movieId === "名偵探柯南" || movieId === "狸想世界(中)" || movieId === "狸想世界(英)" || movieId === "極限返航" || movieId === "超級瑪利歐銀河電影版(中)" || movieId === "超級瑪利歐銀河電影版(英)")) {
                        const moviePageUrl = "https://www.u-movie.com.tw/cinema/page.php?ver=tw&page_type=movie&selProgram=1020&id=2147487891&portal=cinema#plot";
                        window.open(moviePageUrl, '_blank');
                    } else {
                        const url = cinemaUrls[selected];
                        if (url) window.open(url, '_blank');
                        else alert('找不到該影城的訂票連結');
                    }
                } else {
                    cinemaSection.style.display = 'block';
                    cinemaSelect.focus();
                }
            });
        }

        // 綁定訂票按鈕事件（若按鈕存在）
        attachBookButtonHandler();
    </script>
